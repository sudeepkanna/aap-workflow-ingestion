name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - enterprise-poc

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall plugins tests

      - name: Run unit tests
        run: python -m pytest -q
