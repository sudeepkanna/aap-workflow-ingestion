---
- name: Ingest AAP workflow telemetry
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Recursively ingest completed workflow runs
      sudeep.aap_ingestion.aap_workflow_ingest:
        controller_url: "{{ controller_url }}"
        token: "{{ controller_token }}"
        workflow_template_id: "{{ workflow_template_id }}"
        postgres_dsn: "{{ postgres_dsn }}"
        postgres_schema: "{{ postgres_schema | default('aap_ingest') }}"
        api_path: "{{ controller_api_path | default('/api/v2') }}"
        verify_ssl: "{{ controller_verify_ssl | default(true) }}"
      register: ingestion_result

    - name: Display ingestion summary
      ansible.builtin.debug:
        var: ingestion_result
